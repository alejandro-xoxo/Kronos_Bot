# Kronos Bot — proxy reverso para compartir un solo túnel de ngrok
# (plan gratuito, un endpoint) entre n8n (raíz) y el dashboard web
# (/dashboard/). ngrok apunta acá (proxy:80) en vez de directo a n8n.
#
# El webhook de Telethon usa la raíz (https://<dominio>/webhook/...),
# así que la raíz sigue yendo a n8n sin cambios — no rompe nada de lo
# que ya funciona en producción.

server {
    listen 80;

    # /dashboard (sin barra final) -> redirige con barra final, para
    # que las rutas relativas del frontend (fetch("api/positions"),
    # <script src="app.js">) resuelvan bajo /dashboard/.
    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        proxy_pass http://dashboard:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
