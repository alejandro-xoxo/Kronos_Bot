# Stack de PRUEBAS — copia aislada de docker-compose.yml para trabajar
# el rediseño de Fase 4 (Gemini) y otros cambios SIN tocar producción.
#
# Aislamiento respecto al stack de producción (docker-compose.yml):
#   - `name:` propio (kronos_bot_dev) -> Docker Compose prefija con esto
#     todos los contenedores, volúmenes y redes, así que aunque los
#     nombres de servicio/volumen/red de abajo sean iguales a los de
#     producción, nunca chocan ni se comparten.
#   - Puertos de host distintos (ver cada servicio).
#   - Red bridge propia (trading_net_dev), no trading_net.
#   - MT4_ORDERS_HOST_PATH debe apuntar a un SEGUNDO prefijo de Wine
#     (~/.wine-mt4-demo, cuenta demo) — nunca al mismo directorio que
#     usa producción, o vas a mezclar órdenes reales con órdenes de
#     prueba en el mismo EA/carpeta.
#
# Captura de mensajes: este stack NO tiene servicio "telethon". Usa un
# Bot de Telegram normal (Bot API, no MTProto) agregado como miembro
# del grupo de pruebas — ver DEV_SETUP.md sección 5. El nodo de
# entrada en el workflow de n8n dev es un "Telegram Trigger", no el
# Webhook que usa producción — ver la regla permanente en CLAUDE.md
# sobre por qué esto NUNCA se sincroniza con producción.
#
# Uso: siempre con -f docker-compose.dev.yml Y --env-file .env.dev
# explícitos (ver comandos al final del archivo .env.dev / README).
# NUNCA correr esto con el .env de producción por accidente.

name: kronos_bot_dev

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_USER_CHAT_ID=${TELEGRAM_USER_CHAT_ID}
      - KRONOS_WEBHOOK_SECRET=${KRONOS_WEBHOOK_SECRET}
      - MT4_ORDERS_DIR=/mt4-bridge/orders
      - N8N_RESTRICT_FILE_ACCESS_TO=/mt4-bridge/orders;/home/node/.n8n-files
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      # Presente acá a propósito (ausente en producción): el sentido de
      # este stack es poder probar el rediseño de Gemini sin arriesgar
      # la cuenta real. Ver STATUS.md punto 9 — el rediseño en sí sigue
      # pendiente de aprobación, esto solo habilita poder probarlo
      # cuando esté listo.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - n8n_data_dev:/home/node/.n8n
      - ${MT4_ORDERS_HOST_PATH_DEV}:/mt4-bridge/orders
    networks:
      - trading_net_dev

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - n8n
      - dashboard
    networks:
      - trading_net_dev

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN_DEV}
    command:
      - "http"
      - "caddy:8080"
      - "--domain=${N8N_HOST}"
      # Mismo patrón que producción (ver proxy/Caddyfile): caddy rutea
      # /webhook/* -> n8n:5678 (Telegram Trigger de este stack sigue
      # registrando su webhook bajo esa ruta) y todo lo demás ->
      # dashboard:8080 — así el dashboard con el Panel de control
      # queda accesible por la misma URL pública de ngrok, sin
      # necesitar un segundo túnel.
      # Si no tenés un segundo dominio fijo de ngrok reservado, borrá
      # la línea de arriba (--domain=...) para que use una URL
      # aleatoria — vas a tener que reconfigurar el webhook de
      # Telethon/Telegram cada vez que se reinicie este contenedor.
    depends_on:
      - caddy
    networks:
      - trading_net_dev

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Bind a localhost (2026-08-29, mismo hallazgo de seguridad que
      # el puerto de n8n en docker-compose.yml): menor severidad
      # porque Postgres tiene su propia autenticación, pero es
      # superficie de red innecesaria expuesta a toda interfaz.
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - trading_net_dev

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    volumes:
      - ${MT4_ORDERS_HOST_PATH_DEV}:/mt4-bridge/orders
    depends_on:
      - postgres
    networks:
      - trading_net_dev

volumes:
  n8n_data_dev:
  postgres_data_dev:

networks:
  trading_net_dev:
    driver: bridge
