# version: '3.8'

# Fija el nombre del proyecto de Docker Compose para que no dependa del
# nombre del directorio desde donde se ejecuta (por defecto, Compose usa
# el basename del directorio actual como project name, y eso determina
# los nombres de los volúmenes: kronos_bot_postgres_data, etc.). Sin
# esto, correr el mismo compose desde un worktree distinto — ej.
# Kronos_Bot-prod en vez de Kronos_Bot — crearía volúmenes NUEVOS y
# vacíos en vez de reusar los reales (incidente evitado 2026-08-21, al
# migrar producción al worktree de main).
name: kronos_bot

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      # Bind a localhost, no a todas las interfaces (2026-08-29,
      # hallazgo de seguridad): sin esto, cualquiera con acceso de red
      # al host (LAN, wifi compartida) llegaba al editor completo de
      # n8n —workflows, credenciales, ejecución real en MT4— sin pasar
      # por el Basic Auth del dashboard ni por Caddy/ngrok. El acceso
      # real sigue andando igual, vía Caddy (puerto 8080) -> ngrok.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_USER_CHAT_ID=${TELEGRAM_USER_CHAT_ID}
      - KRONOS_WEBHOOK_SECRET=${KRONOS_WEBHOOK_SECRET}
      - MT4_ORDERS_DIR=/mt4-bridge/orders
      - N8N_RESTRICT_FILE_ACCESS_TO=/mt4-bridge/orders;/home/node/.n8n-files
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
    volumes:
      - n8n_data:/home/node/.n8n
      - ${MT4_ORDERS_HOST_PATH}:/mt4-bridge/orders
    networks:
      - trading_net

  caddy:
    image: caddy:2-alpine
    restart: always
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - n8n
      - dashboard
    networks:
      - trading_net

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "caddy:8080"
      - "--domain=${N8N_HOST}"
    depends_on:
      - caddy
    networks:
      - trading_net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - trading_net

  telethon:
    build: ./telethon-service
    restart: always
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/kronos-telethon-signal
      - KRONOS_WEBHOOK_SECRET=${KRONOS_WEBHOOK_SECRET}
    volumes:
      - telethon_session:/app/session
    depends_on:
      - n8n
    networks:
      - trading_net

  dashboard:
    build: ./dashboard
    restart: always
    ports:
      - "8088:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    volumes:
      - ${MT4_ORDERS_HOST_PATH}:/mt4-bridge/orders
    depends_on:
      - postgres
    networks:
      - trading_net

volumes:
  n8n_data:
  telethon_session:
  postgres_data:

networks:
  trading_net:
    driver: bridge