# version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_PROXY_HOPS=2
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_USER_CHAT_ID=${TELEGRAM_USER_CHAT_ID}
      - MT4_ORDERS_DIR=/mt4-bridge/orders
      - N8N_RESTRICT_FILE_ACCESS_TO=/mt4-bridge/orders;/home/node/.n8n-files
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
    volumes:
      - n8n_data:/home/node/.n8n
      - ${MT4_ORDERS_HOST_PATH}:/mt4-bridge/orders
    networks:
      - trading_net

  proxy:
    image: nginx:alpine
    restart: always
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
      - dashboard
    networks:
      - trading_net

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    # El plan gratuito de ngrok solo permite 1 túnel simultáneo, así
    # que en vez de un segundo túnel para el dashboard, ngrok apunta
    # al proxy nginx (mismo dominio de siempre): la raíz sigue yendo
    # a n8n (el webhook de Telethon no cambia), y /dashboard/ va al
    # dashboard nuevo. Ver proxy/nginx.conf.
    command:
      - "http"
      - "proxy:80"
      - "--domain=${N8N_HOST}"
    depends_on:
      - proxy
    networks:
      - trading_net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - trading_net

  telethon:
    build: ./telethon-service
    restart: always
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/kronos-telethon-signal
    volumes:
      - telethon_session:/app/session
    depends_on:
      - n8n
    networks:
      - trading_net

  dashboard:
    build: ./dashboard
    restart: always
    ports:
      - "8088:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    volumes:
      - ${MT4_ORDERS_HOST_PATH}:/mt4-bridge/orders
    depends_on:
      - postgres
    networks:
      - trading_net

volumes:
  n8n_data:
  telethon_session:
  postgres_data:

networks:
  trading_net:
    driver: bridge